<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator">
    <input type="text" class="display" />
    <div class="buttons">
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>/</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>*</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>-</button>
      <button>0</button>
      <button>.</button>
    
      <button>+</button>
      <button>C</button>
      <button>(</button>
      <button>)</button>
      <button></button>
        <button>=</button>

    </div>
  </div>
  <script>
  const display = document.querySelector('.display');
  const buttons = document.querySelectorAll('.buttons button');

  let currentInput = '';

  buttons.forEach(button => {
    button.addEventListener('click', () => {
      const value = button.textContent;

      if (value === 'C') {
        currentInput = '';
        display.value = '';
      } else if (value === '=') {
        try {
          currentInput = eval(currentInput).toString();
          display.value = currentInput;
        } catch {
          display.value = 'Error';
          currentInput = '';
        }
      } else {
        currentInput += value;
        display.value = currentInput;
      }
    });
  });
</script>
</body>
</html>
